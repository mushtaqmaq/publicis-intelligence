<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Publicis Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--bg-2:#F5F5F7;--ink:#1D1D1F;--muted:#6E6E73;--line:#D2D2D7;--accent:#0071E3;--bad:#C4262E;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#000;--bg-2:#1C1C1E;--ink:#F5F5F7;--muted:#A1A1A6;--line:#38383C;--accent:#2997FF;--bad:#FF6961}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--font);letter-spacing:-.022em;-webkit-font-smoothing:antialiased;padding:24px 16px}
main{width:100%;max-width:400px;text-align:center}
h1{font-size:clamp(34px,7vw,48px);line-height:1.05;font-weight:700;letter-spacing:-.04em;margin:0;
  background:linear-gradient(100deg,#0071E3 0%,#8E44EC 45%,#E30B5C 80%,#FF9500 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em}
p.sub{color:var(--muted);font-size:19px;margin:10px 0 34px}
form{text-align:left}
label{display:block;font-size:13px;color:var(--muted);font-weight:500;margin:0 0 6px}
input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);color:var(--ink);margin-bottom:14px}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{width:100%;font:inherit;font-size:17px;padding:14px;border:0;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer;margin-top:6px}
button:disabled{opacity:.5;cursor:default}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:10px 0 0;text-align:center}
.foot{color:var(--muted);font-size:12px;margin-top:40px}
</style>
</head>
<body>
<main>
  <h1>Publicis Intelligence.</h1>
  <p class="sub">Sign in to your workspace.</p>
  <form id="f" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required autofocus>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Sign in</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <p class="foot">Publicis Media Qatar. Accounts are created by your admin.</p>
</main>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('go'), er = document.getElementById('err');
  const email = document.getElementById('email').value.trim(), password = document.getElementById('pw').value;
  if (!email || !password) { er.textContent = 'Enter your email and password.'; return; }
  b.disabled = true; er.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    if (r.ok) { location.href = '/'; return; }
    let m = ''; try { m = (await r.json()).error } catch (_) {}
    er.textContent = m || 'Sign in failed. Try again.';
  } catch (_) { er.textContent = 'The server could not be reached.'; }
  b.disabled = false;
});
</script>
</body>
</html>
