<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Publicis Intelligence</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111114'/%3E%3Cpath d='M11 23V9h6.2a4.6 4.6 0 010 9.2H11' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/icons.js"></script>
</head>
<body>
<div class="shell" id="shell">
  <aside class="sb" id="sb" aria-label="Navigation">
    <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M11 23V9h6.2a4.6 4.6 0 010 9.2H11" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="brand-t"><b>Publicis</b> <span>Intelligence</span></span><button class="collapse" id="collapse" aria-label="Collapse sidebar" title="Collapse sidebar"></button></div>
    <div class="client"><button type="button" class="clientbtn" id="clientBtn" aria-haspopup="listbox" aria-label="Client workspace"></button></div>
    <nav id="nav"></nav>
    <div class="sb-foot">
      <button class="credit-card" data-go="usage" title="Credits"><span class="cc-label">Credits</span><span class="cc-val" id="ccVal">–</span><span class="cc-bar"><i id="ccBar"></i></span></button>
      <div class="who"><span class="avatar" id="avatar">·</span><span class="who-t"><b id="whoName"></b><small id="whoEmail"></small></span><button class="icon-btn" id="signOut" title="Sign out" aria-label="Sign out"></button></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top" id="top">
      <button class="icon-btn menu" id="menuBtn" aria-label="Open menu"></button>
      <p class="crumb" id="crumb"></p>
      <button class="chip" id="topCredits" data-go="usage"></button>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>
<div class="dropzone-page" id="pageDrop" aria-hidden="true"><div>Drop to attach<small>PDF, Word, Excel, PowerPoint, CSV, images or audio</small></div></div>
<button class="fab" id="fab" aria-label="Ask" aria-expanded="false" title="Ask"></button>
<section class="fchat" id="fchat" role="dialog" aria-label="Ask" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/js/core.js"></script>
<script src="/js/brain-core.js"></script>
<script src="/js/composer.js"></script>
<script src="/js/brain.js"></script>

<script src="/js/geo-core.js"></script>
<script src="/js/geo-map.js"></script>
<script src="/js/geo-tabs.js"></script>
<script src="/js/geo.js"></script>
<script src="/js/views.js"></script>
</body>
</html>
