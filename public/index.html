<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Publicis Intelligence</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111318'/%3E%3Cpath d='M11 23V9h6.2a4.6 4.6 0 010 9.2H11' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/icons.js"></script>
<script src="/agents.js"></script>
</head>
<body>
<div class="shell">
  <aside class="sb" id="sb">
    <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M11 23V9h6.2a4.6 4.6 0 010 9.2H11" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span><b>Publicis</b> Intelligence</span></div>
    <label class="client"><span class="sr">Client workspace</span><select id="clientSel"></select></label>
    <nav id="nav" aria-label="Main"></nav>
    <div class="sb-foot">
      <button class="credit-card" id="creditCard" data-go="usage"><span class="cc-label">Credits</span><span class="cc-val" id="ccVal">–</span><span class="cc-bar"><i id="ccBar"></i></span></button>
      <div class="who"><span class="avatar" id="avatar">·</span><span class="who-t"><b id="whoName"></b><small id="whoEmail"></small></span><button class="icon-btn" id="signOut" title="Sign out" aria-label="Sign out"></button></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="icon-btn menu" id="menuBtn" aria-label="Open menu"></button>
      <h1 class="top-title" id="topTitle"></h1>
      <button class="chip" id="topCredits" data-go="usage"></button>
    </header>
    <section id="view" class="view"></section>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
