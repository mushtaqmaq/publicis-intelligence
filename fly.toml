# Backend for Publicis Intelligence. The app name must be globally unique on Fly:
# change it (and the app in docs) before the first `fly launch --no-deploy --copy-config`.
app = "publicis-intelligence-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  PORT = "7860"
  DATA_DIR = "/data"

[mounts]
  source = "pi_data"
  destination = "/data"

# SQLite on one volume means exactly one machine. Do not scale out.
[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
