name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Syntax check (server and client JS)
        run: find server.js api lib scripts test public -name '*.js' -not -path 'public/vendor/*' -print0 | xargs -0 -n1 node --check
      - name: Tests (boots the real server against Postgres with a fake AI provider)
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
        run: npm test
